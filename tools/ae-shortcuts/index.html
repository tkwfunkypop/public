<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AE早見帳">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>AE早見帳 — After Effects ショートカット & エクスプレッション</title>
<style>
  :root {
    --bg: #14141c;
    --bg2: #1c1c28;
    --card: #232333;
    --card2: #2b2b40;
    --line: #34344c;
    --text: #eceaf6;
    --sub: #9d9ab5;
    --accent: #9a8cff;      /* AEっぽい紫 */
    --accent2: #64d8cb;
    --kbd-bg: #32324a;
    --kbd-line: #4a4a68;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding-bottom: calc(24px + var(--safe-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  /* ===== ヘッダー ===== */
  header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, rgba(20,20,28,.98), rgba(20,20,28,.92));
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: var(--safe-top);
  }
  .head-top {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px 4px;
    max-width: 560px; margin: 0 auto;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: #2d2b55;
    color: var(--accent);
    font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #4b47a0;
    flex: none;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  h1 small { display: block; font-size: 10.5px; color: var(--sub); font-weight: 500; }

  .os-toggle {
    margin-left: auto; flex: none;
    display: flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 99px; padding: 3px; gap: 2px;
  }
  .os-toggle button {
    border: 0; background: transparent; color: var(--sub);
    font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 99px;
    cursor: pointer;
  }
  .os-toggle button.on { background: var(--accent); color: #17142e; }

  .searchbar { padding: 8px 14px 10px; max-width: 560px; margin: 0 auto; }
  .searchbar input {
    width: 100%; padding: 10px 14px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
    font-size: 15px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar input::placeholder { color: #6f6c8a; }

  /* ===== タブ ===== */
  .tabs {
    display: flex; max-width: 560px; margin: 0 auto; padding: 0 14px;
  }
  .tabs button {
    flex: 1 1 auto; background: none; border: 0; color: var(--sub);
    font-size: 12.5px; font-weight: 700; padding: 10px 2px 12px;
    white-space: nowrap;
    border-bottom: 3px solid transparent; cursor: pointer;
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }

  /* ===== カテゴリチップ ===== */
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 14px 4px;
    max-width: 560px; margin: 0 auto;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; border: 1px solid var(--line); background: var(--card);
    color: var(--sub); font-size: 12.5px; font-weight: 600;
    padding: 6px 13px; border-radius: 99px; cursor: pointer;
  }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #17142e; }

  /* ===== リスト・カード ===== */
  .list { padding-top: 10px; }
  .cat-head {
    font-size: 12px; font-weight: 800; color: var(--accent);
    letter-spacing: .1em; margin: 18px 2px 8px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
  }
  .sc-row { display: flex; align-items: center; gap: 10px; }
  .sc-name { font-weight: 700; font-size: 14.5px; }
  .sc-desc { color: var(--sub); font-size: 12.5px; margin-top: 2px; }
  .sc-keys { margin-left: auto; flex: none; display: flex; gap: 3px; align-items: center; }
  kbd {
    display: inline-block; min-width: 22px; text-align: center;
    background: var(--kbd-bg); border: 1px solid var(--kbd-line);
    border-bottom-width: 2.5px;
    border-radius: 6px; padding: 3px 7px;
    font: 700 12px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #cfc9ff;
  }
  .plus { color: #5f5c7d; font-size: 11px; font-weight: 700; }

  .empty { text-align: center; color: var(--sub); padding: 50px 0; font-size: 14px; }

  /* ===== エクスプレッションカード ===== */
  .ex-card { padding: 0; overflow: hidden; }
  .ex-head { padding: 13px 14px; cursor: pointer; }
  .ex-title { display: flex; align-items: center; gap: 8px; }
  .ex-title .ex-name { font-weight: 800; font-size: 15.5px; }
  .ex-badge {
    font-size: 10px; font-weight: 800; color: var(--accent2);
    border: 1px solid rgba(100,216,203,.4); border-radius: 6px;
    padding: 1px 7px; letter-spacing: .05em;
  }
  .ex-tag { color: var(--sub); font-size: 12.5px; margin-top: 3px; }
  .ex-caret { margin-left: auto; color: #5f5c7d; transition: transform .2s; font-size: 12px; }
  .ex-card.open .ex-caret { transform: rotate(90deg); }

  .ex-body { display: none; border-top: 1px solid var(--line); padding: 13px 14px 15px; }
  .ex-card.open .ex-body { display: block; }

  .ex-code {
    position: relative;
    background: #101018; border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; margin: 2px 0 12px;
    font: 600 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #b7e6a5; overflow-x: auto; white-space: pre;
  }
  .copy-btn {
    position: absolute; top: 7px; right: 7px;
    background: var(--card2); color: var(--sub);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 11px; font-weight: 700; padding: 4px 10px; cursor: pointer;
  }
  .copy-btn.done { color: var(--accent2); border-color: var(--accent2); }

  .ex-kid {
    background: rgba(154,140,255,.08);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px;
  }
  .ex-kid b { color: var(--accent); }

  .ex-combo {
    background: rgba(100,216,203,.07);
    border-left: 3px solid var(--accent2);
    border-radius: 0 10px 10px 0;
    padding: 10px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .ex-combo .combo-t { font-weight: 800; color: var(--accent2); font-size: 12px; margin-bottom: 4px; }
  .ex-combo ul { margin: 0; padding-left: 18px; }
  .ex-combo li { margin: 4px 0; }
  .ex-combo code, .ex-kid code {
    background: #101018; border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 5px; font-size: 12px; color: #b7e6a5;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .mini-cat {
    display: inline-block; font-size: 10px; color: var(--sub);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 0 5px; font-weight: 600; vertical-align: 2px; margin-left: 2px;
  }

  /* ===== お気に入り・カードリンク ===== */
  .fav-btn {
    background: none; border: 0; font-size: 19px; color: #4a4a68;
    cursor: pointer; padding: 2px 4px; flex: none; line-height: 1;
  }
  .fav-btn.on { color: #ffd166; }
  .link-btn {
    position: absolute; top: 7px; right: 66px;
    background: var(--card2); color: var(--sub);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 11px; font-weight: 700; padding: 4px 8px; cursor: pointer;
  }
  .link-btn.done { color: var(--accent2); border-color: var(--accent2); }

  /* ===== クイズ ===== */
  .quiz-hero { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .quiz-lead { color: var(--sub); font-size: 13px; margin: 0 0 6px; }
  .quiz-prog { font-size: 11px; color: var(--sub); font-weight: 700; letter-spacing: .08em; margin-bottom: 6px; }
  .quiz-q { font-size: 16px; font-weight: 800; margin: 4px 0 2px; }
  .quiz-hint { color: var(--sub); font-size: 12px; margin-bottom: 8px; }
  .quiz-choice {
    display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    margin-top: 10px; padding: 13px 10px; border-radius: 12px;
    background: var(--bg2); border: 1px solid var(--line);
    font-size: 14px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .quiz-choice.ok { border-color: #4ade80; background: rgba(74,222,128,.12); }
  .quiz-choice.ng { border-color: #f87171; background: rgba(248,113,113,.12); opacity: .85; }
  .quiz-mode-btn, .quiz-next {
    display: block; width: 100%; margin-top: 10px; padding: 12px 0; border-radius: 12px;
    background: var(--card2); border: 1px solid var(--kbd-line); color: var(--text);
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .quiz-next { background: var(--accent); border-color: var(--accent); color: #17142e; }
  .quiz-result { text-align: center; padding: 10px 14px 16px; }
  .quiz-score { font-size: 44px; font-weight: 800; color: var(--accent); margin: 6px 0 0; }
  .quiz-msg { font-weight: 700; margin: 6px 0 14px; }

  .demo-wrap { margin-top: 4px; }
  .demo-stage {
    position: relative; height: 120px;
    background:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
      #101018;
    background-size: 20px 20px, 20px 20px, auto;
    border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden;
  }
  .demo-ball {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #c9beff, var(--accent) 60%, #6f5fe0);
    box-shadow: 0 3px 12px rgba(154,140,255,.45);
    top: 0; left: 0;
    will-change: transform;
  }
  .demo-ball.b2 { background: radial-gradient(circle at 32% 30%, #b8f4ec, var(--accent2) 60%, #35a99c); box-shadow: 0 3px 12px rgba(100,216,203,.4); }
  .demo-ball.b3 { background: radial-gradient(circle at 32% 30%, #ffd9a8, #f2a65a 60%, #cf7f34); box-shadow: 0 3px 12px rgba(242,166,90,.4); }
  .demo-ball.square { border-radius: 7px; }
  .demo-ghost { opacity: .35; }
  .demo-label {
    position: absolute; bottom: 6px; left: 10px;
    font-size: 10.5px; color: #6f6c8a; font-weight: 600; pointer-events: none;
  }
  .demo-btn {
    margin-top: 9px; width: 100%;
    background: var(--card2); border: 1px solid var(--kbd-line);
    color: var(--text); font-size: 13px; font-weight: 800;
    border-radius: 10px; padding: 9px 0; cursor: pointer;
  }
  .demo-btn.playing { background: var(--accent); border-color: var(--accent); color: #17142e; }

  footer { text-align: center; color: #5f5c7d; font-size: 11.5px; margin-top: 34px; }
</style>
</head>
<body>

<header>
  <div class="head-top">
    <div class="logo">Ae</div>
    <h1>AE早見帳<small>After Effects ショートカット & エクスプレッション</small></h1>
    <div class="os-toggle" id="osToggle">
      <button data-os="mac" class="on">Mac</button>
      <button data-os="win">Win</button>
    </div>
  </div>
  <div class="searchbar">
    <input id="search" type="search" placeholder="キーワードで検索（例: キーフレーム, wiggle, 複製）" autocomplete="off">
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="shortcuts" class="on">⌨️ ショートカット</button>
    <button data-tab="expressions">✨ エクスプレッション</button>
    <button data-tab="quiz">🎯 クイズ</button>
  </nav>
</header>

<div class="chips" id="chips"></div>

<main class="wrap">
  <div class="list" id="list"></div>
  <footer>AE早見帳 — ホーム画面に追加するとアプリのように使えます</footer>
</main>

<!-- アプリ配布(オフライン動作)のため anime.js はローカル同梱版を読む -->
<script src="./anime.umd.min.js"></script>
<script src="../../lib/animations.js"></script>
<script>
// インストール型アプリとして動くよう Service Worker を登録(https配信時のみ)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
<script>
/* UI演出は lib/animations.js の AP.* を使う。
   オフラインやCSPで anime.js が読めない環境でも一覧機能は使えるようにガード */
const FX = (typeof AP !== 'undefined' && AP) ? AP : { staggerReveal(){}, pop(){}, fadeInUp(){}, countUp(){} };

/* ▼ アプリ情報（更新したらここと sw.js の CACHE を上げる） */
const APP_VERSION = 'v1.1';
const APP_DATE = '2026-07-02';

/* ▼ 匿名アクセス集計（任意・既定OFF）
   GoatCounter (https://www.goatcounter.com) で無料サイトを作り、
   そのコード（例: 'aehayamicho'）を入れると有効になる。
   何が検索されたか・クイズの得点など「つまずきポイント」だけを匿名で数える。
   有効化したら配布案内にプライバシーの一文を添えること（README参照） */
const GOATCOUNTER = '';
function track(path) {
  if (!GOATCOUNTER) return;
  try {
    const url = `https://${GOATCOUNTER}.goatcounter.com/count?p=${encodeURIComponent(path)}`;
    if (navigator.sendBeacon) navigator.sendBeacon(url);
    else fetch(url, { mode: 'no-cors' }).catch(() => {});
  } catch (e) { /* 集計失敗はアプリ動作に影響させない */ }
}

/* ▼ お気に入り（この端末のみに保存） */
let favsInit = [];
try { favsInit = JSON.parse(localStorage.getItem('aeh-favs') || '[]'); } catch (e) {}
const FAVS = new Set(favsInit);
function toggleFav(key) {
  FAVS.has(key) ? FAVS.delete(key) : FAVS.add(key);
  try { localStorage.setItem('aeh-favs', JSON.stringify([...FAVS])); } catch (e) {}
}
const attr = s => s.replace(/"/g, '&quot;');
/* カード直リンク用のID（例: loopOut("cycle") → loopout-cycle） */
const slugOf = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

/* =========================================================
   データ: ショートカット
   win/mac は "+" 区切り。説明は中学生でもわかる言葉で。
========================================================= */
const SHORTCUTS = [
  // --- 基本操作 ---
  { cat: '基本操作', hot: 3, name: '取り消し（アンドゥ）', win: 'Ctrl+Z', mac: '⌘+Z', desc: '「やっちゃった！」を1つ前に戻す。困ったらまずこれ' },
  { cat: '基本操作', name: 'やり直し（リドゥ）', win: 'Ctrl+Shift+Z', mac: '⌘+Shift+Z', desc: '戻しすぎたときに、もう一度進める' },
  { cat: '基本操作', hot: 3, name: '保存', win: 'Ctrl+S', mac: '⌘+S', desc: 'こまめに保存！AEが落ちても泣かないために' },
  { cat: '基本操作', hot: 3, name: '複製', win: 'Ctrl+D', mac: '⌘+D', desc: '選んだレイヤーやアイテムのコピーをすぐ作る' },
  { cat: '基本操作', name: '新規コンポジション', win: 'Ctrl+N', mac: '⌘+N', desc: '動画の「舞台」を新しく作る' },
  { cat: '基本操作', name: 'コンポジション設定', win: 'Ctrl+K', mac: '⌘+K', desc: 'サイズ・長さ・フレームレートをあとから変える' },
  { cat: '基本操作', name: 'ファイルを読み込み', win: 'Ctrl+I', mac: '⌘+I', desc: '画像・動画・音などの素材をプロジェクトに入れる' },
  { cat: '基本操作', name: 'レンダーキューに追加', win: 'Ctrl+M', mac: '⌘+M', desc: '完成した動画を書き出す準備をする' },
  { cat: '基本操作', name: 'Media Encoderキューに追加', win: 'Ctrl+Alt+M', mac: '⌘+Opt+M', desc: 'MP4などで書き出したいときはこっち' },
  { cat: '基本操作', hot: 1, name: '環境設定を開く', win: 'Ctrl+Alt+;', mac: '⌘+Opt+;', desc: 'AE全体の設定画面を開く' },

  // --- ツール ---
  { cat: 'ツール', hot: 3, name: '選択ツール', win: 'V', mac: 'V', desc: 'いちばん基本の矢印。迷ったらVで戻る' },
  { cat: 'ツール', name: '手のひらツール', win: 'H', mac: 'H', desc: '画面をつかんで移動。Space長押しでも一時的に使える' },

  { cat: 'ツール', name: 'シェイプツール切り替え', win: 'Q', mac: 'Q', desc: '四角→丸→星…と押すたびに図形が変わる' },
  { cat: 'ツール', name: '文字ツール', win: 'Ctrl+T', mac: '⌘+T', desc: 'テキストを打つモードに切り替え' },
  { cat: 'ツール', name: 'アンカーポイントツール', win: 'Y', mac: 'Y', desc: '回転や拡大の「中心点」をずらす' },

  { cat: 'レイヤー', hot: 3, name: '新規平面（ソリッド）', win: 'Ctrl+Y', mac: '⌘+Y', desc: 'ベタ塗り1色のレイヤーを作る。背景やエフェクト台に' },
  { cat: 'レイヤー', hot: 3, name: '新規調整レイヤー', win: 'Ctrl+Alt+Y', mac: '⌘+Opt+Y', desc: '下のレイヤー全部にまとめてエフェクトをかける透明な板' },
  { cat: 'レイヤー', name: '新規ヌルオブジェクト', win: 'Ctrl+Alt+Shift+Y', mac: '⌘+Opt+Shift+Y', desc: '見えない「親」レイヤー。まとめて動かす司令塔' },
  { cat: 'レイヤー', name: '新規テキストレイヤー', win: 'Ctrl+Alt+Shift+T', mac: '⌘+Opt+Shift+T', desc: '文字レイヤーをすぐ作る' },
  { cat: 'レイヤー', hot: 3, name: 'プリコンポーズ', win: 'Ctrl+Shift+C', mac: '⌘+Shift+C', desc: '複数レイヤーを1つの箱にまとめて整理する' },
  { cat: 'レイヤー', hot: 3, name: 'レイヤーを分割', win: 'Ctrl+Shift+D', mac: '⌘+Shift+D', desc: '再生ヘッドの位置でレイヤーをパチンと2つに切る' },
  { cat: 'レイヤー', name: 'レイヤー名を変更', win: 'Enter', mac: 'Return', desc: '選んだレイヤーの名前をその場で書き換え' },
  { cat: 'レイヤー', name: 'コンポの中央に配置', win: 'Ctrl+Home', mac: '⌘+Home', desc: 'レイヤーを画面のど真ん中へ一発移動' },
  { cat: 'レイヤー', name: 'アンカーポイントを中央へ', win: 'Ctrl+Alt+Home', mac: '⌘+Opt+Home', desc: '中心点をレイヤーの真ん中に戻す' },

const state = {
  tab: 'shortcuts',
  os: /Mac|iPhone|iPad/.test(navigator.userAgent) ? 'mac' : 'win',

  cat: 'すべて',
};

const $list = document.getElementById('list');
const $chips = document.getElementById('chips');
const $search = document.getElementById('search');
const $tabs = document.getElementById('tabs');
const $osToggle = document.getElementById('osToggle');

function cats() {
  const src = state.tab === 'shortcuts' ? SHORTCUTS : EXPRESSIONS;
  return ['すべて', '★', ...new Set(src.map(x => x.cat))];
}

function renderChips() {
  if (state.tab === 'quiz') { $chips.innerHTML = ''; return; }
  $chips.innerHTML = cats().map(c =>
    `<button data-cat="${c}" class="${c === state.cat ? 'on' : ''}">${c === '★' ? '★ お気に入り' : c}</button>`
  ).join('');
}

function keyHtml(combo) {
  // "Ctrl+Shift+D" → kbd列。 " / " 区切りはペア表記
  return combo.split(' / ').map(part =>
    part.split('+').map(k => `<kbd>${k}</kbd>`).join('<span class="plus">+</span>')
  ).join('<span class="plus">／</span>');
}

function match(item, fields) {
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return fields.some(f => {
    const v = item[f];
    return (Array.isArray(v) ? v.join(' ') : (v || '')).toLowerCase().includes(q);
  });
}

/* よく使う度（hot: 1〜3、省略時は2）。「すべて」表示では★の多い順に並べる */
const hotOf = x => x.hot != null ? x.hot : 2;
const TIER_LABEL = { 3: '★★★ 超よく使う', 2: '★★ よく使う', 1: '★ 覚えておくと便利' };
const sortByHot = items => items.slice().sort((a, b) => hotOf(b) - hotOf(a));

function renderShortcuts() {
  const favView = state.cat === '★';
  const byTier = state.cat === 'すべて' || favView;
  const items = sortByHot(SHORTCUTS.filter(s =>
    (favView ? FAVS.has('s:' + s.name) : (byTier || s.cat === state.cat)) &&
    match(s, ['name', 'desc', 'win', 'mac', 'cat'])
  ));
  if (!items.length) {
    $list.innerHTML = `<div class="empty">${favView && !state.query ? '各項目の ★ を押すと、ここに自分専用の早見帳が作れます' : '見つかりませんでした 🔍'}</div>`;
    return;
  }

  let html = '', lastHead = '';
  for (const s of items) {
    const head = byTier ? TIER_LABEL[hotOf(s)] : `■ ${s.cat}`;
    if (head !== lastHead) { html += `<div class="cat-head">${head}</div>`; lastHead = head; }
    html += `
      <div class="card sc-card">
        <div class="sc-row">
          <div>
            <div class="sc-name">${s.name}${byTier ? ` <span class="mini-cat">${s.cat}</span>` : ''}</div>
            <div class="sc-desc">${s.desc}</div>
          </div>
          <div class="sc-keys">${keyHtml(s[state.os])}</div>
          <button class="fav-btn ${FAVS.has('s:' + s.name) ? 'on' : ''}" data-key="s:${attr(s.name)}" aria-label="お気に入り">★</button>
        </div>
      </div>`;
  }
  $list.innerHTML = html;
  FX.staggerReveal('#list .card', { each: 24, duration: 380 });
}

function renderExpressions() {
  const favView = state.cat === '★';
  const byTier = state.cat === 'すべて' || favView;
  const items = sortByHot(EXPRESSIONS.filter(e =>
    (favView ? FAVS.has('e:' + e.name) : (byTier || e.cat === state.cat)) &&
    match(e, ['name', 'tag', 'kid', 'code', 'cat', 'combo'])
  ));
  if (!items.length) {
    $list.innerHTML = `<div class="empty">${favView && !state.query ? '各項目の ★ を押すと、ここに自分専用の早見帳が作れます' : '見つかりませんでした 🔍'}</div>`;
    return;
  }

  let html = '', lastHead = '';
  items.forEach(e => {
    const i = EXPRESSIONS.indexOf(e);
    const head = byTier ? TIER_LABEL[hotOf(e)] : `■ ${e.cat}`;
    if (head !== lastHead) { html += `<div class="cat-head">${head}</div>`; lastHead = head; }
    html += `
      <div class="card ex-card" data-i="${i}" id="${slugOf(e.name)}">
        <div class="ex-head">
          <div class="ex-title">
            <span class="ex-name">${e.name}</span>
            <span class="ex-badge">${e.badge}</span>
            <button class="fav-btn ${FAVS.has('e:' + e.name) ? 'on' : ''}" data-key="e:${attr(e.name)}" aria-label="お気に入り" style="margin-left:auto">★</button>
            <span class="ex-caret" style="margin-left:0">▶</span>
          </div>
          <div class="ex-tag">${e.tag}</div>
        </div>
        <div class="ex-body">
          <div class="ex-code">${e.code}<button class="link-btn" data-slug="${slugOf(e.name)}">🔗</button><button class="copy-btn">コピー</button></div>
          <div class="ex-kid">${e.kid}</div>
          ${e.combo ? `
          <div class="ex-combo">
            <div class="combo-t">🧩 おすすめの組み合わせ</div>
            <ul>${e.combo.map(c => `<li>${c}</li>`).join('')}</ul>
          </div>` : ''}
          ${e.demo ? `
          <div class="demo-wrap">
            <div class="demo-stage"><span class="demo-label">${e.name} のイメージ</span></div>
            <button class="demo-btn">▶ 動きを見る</button>
          </div>` : ''}
        </div>
      </div>`;
  });
  $list.innerHTML = html;
  FX.staggerReveal('#list .card', { each: 30, duration: 380 });
}

function render() {
  stopDemo();
  renderChips();
  document.querySelector('.searchbar').style.display = state.tab === 'quiz' ? 'none' : '';
  if (state.tab === 'quiz') renderQuiz();
  else (state.tab === 'shortcuts' ? renderShortcuts : renderExpressions)();
}

/* =========================================================
   クイズモード（10問ランダム出題・単語帳がわり）
========================================================= */
let quiz = null;
const shuffle = arr => arr.slice().sort(() => Math.random() - 0.5);

function buildQuiz(mode) {
  const scQ = s => {
    const pool = shuffle([...new Set(SHORTCUTS.map(x => x[state.os]))].filter(k => k !== s[state.os])).slice(0, 3);
    return { text: `「${s.name}」のショートカットは？`, hint: s.desc, answer: s[state.os], choices: shuffle([s[state.os], ...pool]), isKey: true };
  };
  const exQ = x => {
    const pool = shuffle(EXPRESSIONS.filter(y => y !== x)).slice(0, 3).map(y => y.name);
    return { text: `「${x.tag}」— どのエクスプレッション？`, hint: '', answer: x.name, choices: shuffle([x.name, ...pool]), isKey: false };
  };
  const qs = mode === 'sc' ? shuffle(SHORTCUTS).slice(0, 10).map(scQ)
    : mode === 'ex' ? shuffle(EXPRESSIONS).slice(0, 10).map(exQ)
    : shuffle([...shuffle(SHORTCUTS).slice(0, 5).map(scQ), ...shuffle(EXPRESSIONS).slice(0, 5).map(exQ)]);
  quiz = { mode, qs, i: 0, score: 0, answered: false };
}

function renderQuiz() {
  if (!quiz) {
    $list.innerHTML = `
      <div class="card" style="padding:16px 14px">
        <div class="quiz-hero">🎯 クイズで覚える</div>
        <p class="quiz-lead">ランダムに10問出題。繰り返すほど手が覚えます。<br>ショートカットは <b>${state.os === 'mac' ? 'Mac' : 'Windows'}</b> のキーで出題（ヘッダーで切替可）。</p>
        <button class="quiz-mode-btn" data-mode="sc">⌨️ ショートカット 10問</button>
        <button class="quiz-mode-btn" data-mode="ex">✨ エクスプレッション 10問</button>
        <button class="quiz-mode-btn" data-mode="mix">🔀 ミックス 10問</button>
      </div>`;
    FX.fadeInUp('#list .card', { duration: 300 });
    return;
  }
  if (quiz.i >= quiz.qs.length) {
    const s = quiz.score, n = quiz.qs.length;
    const msg = s >= 9 ? '満点級！AE使いの手練です 🏆' : s >= 7 ? 'すごい！あと少しで満点 🔥' : s >= 4 ? 'いい感じ！もう一周で定着 💪' : 'まずは「★★★ 超よく使う」から覚えよう 📖';
    $list.innerHTML = `
      <div class="card quiz-result">
        <div class="quiz-prog">RESULT</div>
        <div class="quiz-score"><span class="q-score" data-to="${s}">${s}</span> / ${n}</div>
        <div class="quiz-msg">${msg}</div>
        <button class="quiz-next" data-act="retry">🔁 もう一度（同じモード）</button>
        <button class="quiz-mode-btn" data-act="menu">モード選択にもどる</button>
      </div>`;
    if (window.AP) AP.countUp('.q-score');
    FX.pop('.quiz-score');
    track(`/quiz/${quiz.mode}/${s}`);
    return;
  }
  const q = quiz.qs[quiz.i];
  $list.innerHTML = `
    <div class="card quiz-wrap" style="padding:14px">
      <div class="quiz-prog">Q${quiz.i + 1} / ${quiz.qs.length}　スコア ${quiz.score}</div>
      <div class="quiz-q">${q.text}</div>
      ${q.hint ? `<div class="quiz-hint">ヒント: ${q.hint}</div>` : ''}
      ${q.choices.map((c, ci) => `<div class="quiz-choice" data-ci="${ci}">${q.isKey ? keyHtml(c) : c}</div>`).join('')}
      <div class="quiz-foot"></div>
    </div>`;
  FX.fadeInUp('.quiz-wrap', { duration: 250 });
}

function answerQuiz(ci) {
  const q = quiz.qs[quiz.i];
  quiz.answered = true;
  const correct = q.choices[ci] === q.answer;
  if (correct) quiz.score++;
  document.querySelectorAll('.quiz-choice').forEach((el, idx) => {
    if (q.choices[idx] === q.answer) el.classList.add('ok');
    else if (idx === ci) el.classList.add('ng');
  });
  FX.pop('.quiz-choice.' + (correct ? 'ok' : 'ng'));
  document.querySelector('.quiz-prog').textContent = `Q${quiz.i + 1} / ${quiz.qs.length}　スコア ${quiz.score}`;
  const last = quiz.i === quiz.qs.length - 1;
  document.querySelector('.quiz-foot').innerHTML =
    `<button class="quiz-next" data-act="next">${last ? '結果を見る' : '次の問題 →'}</button>`;
}

/* =========================================================
   デモエンジン
   AEのエクスプレッションの挙動を rAF でシミュレートする。
   （UI演出は AP.* を使用。デモ本体は式の再現なので専用実装）
========================================================= */
let demo = null; // { raf, btn, stage }

function fract(x) { return x - Math.floor(x); }
function stepRandom(step, seed) { return fract(Math.sin(step * 12.9898 + seed * 78.233) * 43758.5453); }
// wiggleっぽい滑らかノイズ（sin波の重ね合わせ）
function pseudoWiggle(t, freq, amp, seed = 0) {
  let v = 0, f = freq, a = 1, total = 0;
  for (let i = 0; i < 3; i++) {
    v += Math.sin(t * Math.PI * 2 * f + seed * 7.31 + i * 1.7) * a;
    total += a; f *= 1.93; a *= 0.5;
  }
  return (v / total) * amp;
}
function smoothstep(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

function makeBall(stage, cls = '') {
  const b = document.createElement('div');
  b.className = 'demo-ball ' + cls;
  stage.appendChild(b);
  return b;
}
function place(el, x, y, rot = 0, scale = 1, opacity = 1) {
  el.style.transform = `translate(${x - 13}px, ${y - 13}px) rotate(${rot}deg) scale(${scale})`;
  el.style.opacity = opacity;
}

const DEMOS = {
  // wiggle(2,30): 中心のまわりをランダムにプルプル
  wiggle(stage, W, H) {
    const b = makeBall(stage);
    return t => place(b, W / 2 + pseudoWiggle(t, 2, W * 0.28, 1), H / 2 + pseudoWiggle(t, 2, 32, 9));
  },
  // loopOut("cycle"): 左→右の1秒アニメを繰り返す（最後にパッと戻る）
  loopcycle(stage, W, H) {
    const b = makeBall(stage);
    return t => place(b, 30 + smoothstep(fract(t / 1.2)) * (W - 60), H / 2);
  },
  // loopOut("pingpong"): 行って戻って（三角波）
  pingpong(stage, W, H) {
    const b = makeBall(stage);
    return t => {
      const ph = fract(t / 2.4) * 2;                 // 0..2
      const x = ph < 1 ? smoothstep(ph) : smoothstep(2 - ph);
      place(b, 30 + x * (W - 60), H / 2);
    };
  },
  // time*90: 一定スピードで回転し続ける
  time(stage, W, H) {
    const b = makeBall(stage, 'square');
    return t => place(b, W / 2, H / 2, t * 90, 1.3);
  },
  // random(0,100): 毎フレーム(風)に値がジャンプ
  random(stage, W, H) {
    const b = makeBall(stage);
    return t => {
      const s = Math.floor(t * 9);
      place(b, 20 + stepRandom(s, 1) * (W - 40), 20 + stepRandom(s, 2) * (H - 40), 0, 1, 0.4 + stepRandom(s, 3) * 0.6);
    };
  },
  // Math.sin: 規則正しくゆらゆら
  sin(stage, W, H) {
    const b = makeBall(stage);
    return t => place(b, W / 2 + Math.sin(t * 2) * (W * 0.32), H / 2 + Math.cos(t * 4) * 8);
  },
  // linear(time,0,2,0,100): 2秒で到達→止まる→少し待ってリプレイ
  linear(stage, W, H) {
    const b = makeBall(stage);
    return t => {
      const ph = Math.min(t % 3.2, 2) / 2;
      place(b, 30 + ph * (W - 60), H / 2);
    };
  },
  // ease(): linearと同じだが発進・到着がなめらか
  ease(stage, W, H) {
    const raw = makeBall(stage, 'demo-ghost');
    const b = makeBall(stage, 'b2');
    return t => {
      const ph = Math.min(t % 3.2, 2) / 2;
      place(raw, 30 + ph * (W - 60), H / 2 - 24);          // 上: linear（比較用）
      place(b, 30 + smoothstep(ph) * (W - 60), H / 2 + 24); // 下: ease
    };
  },
  // clamp(): 大きなsin波を柵で止める
  clamp(stage, W, H) {
    const raw = makeBall(stage, 'demo-ghost');
    const b = makeBall(stage, 'b2');
    const limit = W * 0.25;
    return t => {
      const v = Math.sin(t * 1.6) * (W * 0.45);
      place(raw, W / 2 + v, H / 2 - 24);                                     // 上: そのまま
      place(b, W / 2 + Math.max(-limit, Math.min(limit, v)), H / 2 + 24);    // 下: clampあり
    };
  },
  // posterizeTime(8): なめらかなwiggleを8fpsに間引く
  posterize(stage, W, H) {
    const raw = makeBall(stage, 'demo-ghost');
    const b = makeBall(stage, 'b3');
    return t => {
      const pt = Math.floor(t * 8) / 8; // 8fpsに量子化
      place(raw, W / 2 + pseudoWiggle(t, 1.2, W * 0.3, 4), H / 2 - 24);
      place(b, W / 2 + pseudoWiggle(pt, 1.2, W * 0.3, 4), H / 2 + 24);
    };
  },
  // valueAtTime(time-0.2): リーダーを遅れて追いかける
  delay(stage, W, H) {
    const leader = makeBall(stage);
    const f1 = makeBall(stage, 'b2');
    const f2 = makeBall(stage, 'b3');
    const pos = t => [W / 2 + Math.sin(t * 1.8) * (W * 0.32), H / 2 + Math.sin(t * 3.6) * 20];
    return t => {
      place(leader, ...pos(t));
      place(f1, ...pos(t - 0.25), 0, 0.85, 0.85);
      place(f2, ...pos(t - 0.5), 0, 0.7, 0.7);
    };
  },
  // index: 番号ぶん遅れてジャンプ（ウェーブ）
  index(stage, W, H) {
    const balls = [makeBall(stage), makeBall(stage, 'b2'), makeBall(stage, 'b3')];
    return t => balls.forEach((b, i) => {
      const lt = Math.max(0, t - i * 0.18);
      const y = Math.abs(Math.sin(lt * 3)) * (H * 0.32);
      place(b, W * (0.28 + i * 0.22), H * 0.68 - y);
    });
  },
  // smooth(): ガタガタ vs ならした後
  smooth(stage, W, H) {
    const raw = makeBall(stage, 'demo-ghost');
    const b = makeBall(stage, 'b2');
    const noisy = t => pseudoWiggle(t, 4, W * 0.3, 2) + (stepRandom(Math.floor(t * 20), 5) - 0.5) * 30;
    return t => {
      let avg = 0; const N = 7;
      for (let i = 0; i < N; i++) avg += noisy(t - i * 0.05);
      place(raw, W / 2 + noisy(t), H / 2 - 24);      // 上: ガタガタ
      place(b, W / 2 + avg / N, H / 2 + 24);         // 下: smooth後
    };
  },
};

function stopDemo() {
  if (!demo) return;
  cancelAnimationFrame(demo.raf);
  demo.stage.querySelectorAll('.demo-ball').forEach(b => b.remove());
  demo.btn.classList.remove('playing');
  demo.btn.textContent = '▶ 動きを見る';
  demo = null;
}

function startDemo(btn, stage, kind) {
  stopDemo(); // 同時再生は1つだけ（バッテリー節約）
  const W = stage.clientWidth, H = stage.clientHeight;
  const update = DEMOS[kind](stage, W, H);
  const t0 = performance.now();
  demo = { btn, stage, raf: 0 };
  const loop = now => {
    update((now - t0) / 1000);
    demo.raf = requestAnimationFrame(loop);
  };
  demo.raf = requestAnimationFrame(loop);
  btn.classList.add('playing');
  btn.textContent = '■ 停止';
  FX.pop(stage);
}

/* =========================================================
   イベント
========================================================= */
$tabs.addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn || btn.dataset.tab === state.tab) return;
  state.tab = btn.dataset.tab;
  state.cat = 'すべて';
  if (state.tab === 'quiz') quiz = null;
  $tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
  $osToggle.style.visibility = state.tab === 'expressions' ? 'hidden' : 'visible';
  track('/tab/' + state.tab);
  render();
});

$osToggle.addEventListener('click', e => {
  const btn = e.target.closest('button[data-os]');
  if (!btn) return;
  state.os = btn.dataset.os;
  $osToggle.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
  FX.pop(btn);
  if (state.tab === 'shortcuts') renderShortcuts();
});

$chips.addEventListener('click', e => {
  const btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  state.cat = btn.dataset.cat;
  render();
});

let searchTimer;
$search.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = $search.value.trim();
    render();
    if (state.query) track('/search/' + state.query);
  }, 180);
});

function copyText(text) {
  return (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    });
}

$list.addEventListener('click', e => {
  // お気に入り ★
  const favBtn = e.target.closest('.fav-btn');
  if (favBtn) {
    e.stopPropagation();
    toggleFav(favBtn.dataset.key);
    favBtn.classList.toggle('on', FAVS.has(favBtn.dataset.key));
    FX.pop(favBtn);
    if (state.cat === '★') render(); // ★一覧の表示中は外した項目を消す
    return;
  }
  // クイズ操作
  const modeBtn = e.target.closest('.quiz-mode-btn');
  if (modeBtn) {
    if (modeBtn.dataset.mode) buildQuiz(modeBtn.dataset.mode); else quiz = null;
    renderQuiz();
    return;
  }
  const choice = e.target.closest('.quiz-choice');
  if (choice && quiz && !quiz.answered) { answerQuiz(Number(choice.dataset.ci)); return; }
  const nextBtn = e.target.closest('.quiz-next');
  if (nextBtn) {
    if (nextBtn.dataset.act === 'retry') buildQuiz(quiz.mode);
    else { quiz.i++; quiz.answered = false; }
    renderQuiz();
    return;
  }
  // カード直リンクのコピー 🔗
  const linkBtn = e.target.closest('.link-btn');
  if (linkBtn) {
    e.stopPropagation();
    copyText(location.href.split('#')[0] + '#' + linkBtn.dataset.slug).finally(() => {
      linkBtn.textContent = '✓';
      linkBtn.classList.add('done');
      FX.pop(linkBtn);
      setTimeout(() => { linkBtn.textContent = '🔗'; linkBtn.classList.remove('done'); }, 1400);
    });
    return;
  }
  // コード コピー
  const copyBtn = e.target.closest('.copy-btn');
  if (copyBtn) {
    e.stopPropagation();
    const box = copyBtn.parentElement.cloneNode(true);
    box.querySelectorAll('button').forEach(b => b.remove());
    copyText(box.textContent.trim()).finally(() => {
      copyBtn.textContent = '✓ OK!';
      copyBtn.classList.add('done');
      FX.pop(copyBtn);
      setTimeout(() => { copyBtn.textContent = 'コピー'; copyBtn.classList.remove('done'); }, 1400);
    });
    return;
  }
  // デモ再生 / 停止
  const demoBtn = e.target.closest('.demo-btn');
  if (demoBtn) {
    const card = demoBtn.closest('.ex-card');
    const kind = EXPRESSIONS[Number(card.dataset.i)].demo;
    if (demo && demo.btn === demoBtn) stopDemo();
    else startDemo(demoBtn, card.querySelector('.demo-stage'), kind);
    return;
  }
  // カードの開閉（開いたらデモを自動再生）
  const head = e.target.closest('.ex-head');
  if (head) {
    const card = head.parentElement;
    const opening = !card.classList.contains('open');
    if (!opening && demo && card.contains(demo.stage)) stopDemo();
    card.classList.toggle('open');
    if (opening) {
      FX.fadeInUp(card.querySelector('.ex-body'), { duration: 300, translateY: [10, 0] });
      const btn = card.querySelector('.demo-btn');
      if (btn) startDemo(btn, card.querySelector('.demo-stage'), EXPRESSIONS[Number(card.dataset.i)].demo);
    }
  }
});

/* カード直リンク: #wiggle のようなハッシュ付きで開いたら該当カードを開く */
function openFromHash() {
  const slug = decodeURIComponent(location.hash.slice(1));
  if (!slug) return;
  const i = EXPRESSIONS.findIndex(x => slugOf(x.name) === slug);
  if (i < 0) return;
  if (state.tab !== 'expressions') {
    state.tab = 'expressions';
    state.cat = 'すべて';
    $tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'expressions'));
    $osToggle.style.visibility = 'hidden';
    render();
  }
  const card = document.querySelector(`.ex-card[data-i="${i}"]`);
  if (card && !card.classList.contains('open')) {
    card.querySelector('.ex-head').click();
    setTimeout(() => card.scrollIntoView({ block: 'start', behavior: 'smooth' }), 80);
  }
}

/* 初期化 */
$osToggle.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.os === state.os));
document.querySelector('footer').textContent =
  `AE早見帳 ${APP_VERSION} (${APP_DATE}) — ホーム画面に追加するとアプリのように使えます`;
render();
openFromHash();
window.addEventListener('hashchange', openFromHash);
track('/app');
</script>
