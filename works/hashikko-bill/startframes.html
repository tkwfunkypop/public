<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Floyoスタートフレーム 78カット — はしっこビルの明日づくり</title><style>body{background:#151320;color:#e8e6df;font-family:"Hiragino Sans","Yu Gothic",sans-serif;margin:0;padding:40px}h1,h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;letter-spacing:.06em}p.note{opacity:.75;max-width:56em;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin:18px 0 34px}figure{margin:0;background:#0b0b12;border:1px solid rgba(232,230,223,.2);border-radius:10px;overflow:hidden}img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}figcaption{padding:8px 10px;font-size:12px;line-height:1.6}figcaption b{color:#E8A13C;margin-right:6px}</style></head><body><h1>Floyo I2V スタートフレーム — 全78カット</h1><p class="note">各カットのI2V開始フレーム（CANON準拠のフルカラースチル・文字なし）。キャラは承認済み図版、ビル外観はCANON（案3-C&#39;）を参照して生成。検品でNGのカットは番号を指定してもらえればリロールします。台帳は generated.json の kind: floyo_start_frame。</p><h2>A｜果端ビル</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183454_5a66ea04-5662-433b-8dcd-712add8ece81.png" alt="C01"><figcaption><b>C01</b> 白い霧だけの画面。奥に、傾いた七階建てのビルの輪郭がぼんやり浮かぶ。地面はビルの足元で途切れ、その先は何もない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183458_6e33344a-3b24-4893-bde8-2938e7c226d8.png" alt="C02"><figcaption><b>C02</b> 郵便受けの列。七つ。どれも埃をかぶっている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225757_86e27038-597a-42a8-a400-581994e04a8c.png" alt="C03"><figcaption><b>C03</b> 階段の吹き抜けを見上げるアオリ。七層ぶんの手すりが螺旋に重なる。人はいない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225801_e7f6e705-cd6e-4346-be26-29198399f3fb.png" alt="C04"><figcaption><b>C04</b> エレベーターの階数表示。1→3→4→5→7。2と6のランプだけ点かない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225807_1675e782-c79d-4c3f-82f1-3b5135aa8abd.png" alt="C05"><figcaption><b>C05</b> 七つの扉が並ぶ廊下。全部閉まっている。時間をずらして出社するので誰ともすれ違わない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183519_02dd58fe-2fce-40e8-8b9f-d526866def6d.png" alt="C06"><figcaption><b>C06</b> タイトル入れ。霧の中に浮く。</figcaption></figure></div><h2>B｜差出人：このビル</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183540_534dacb6-9e3d-4781-aa84-1c21ba9e3654.png" alt="C07"><figcaption><b>C07</b> 机の上にすべり込む一通の封筒。宛名は各社名。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183547_99b31845-7d53-4d03-8ef0-676aa28c576a.png" alt="C08"><figcaption><b>C08</b> 依頼書のクローズ。件名「明日を一日、つくってください」。納期七日後。予算 金一封。発注者 このビル。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183551_b9fedff0-ee38-4982-95a8-f0ed7297ce6a.png" alt="C09"><figcaption><b>C09</b> 封筒を逆さに振る手。何も落ちてこない。空。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225816_6f905ce6-e5fd-4bac-8968-5972ee2d7f09.png" alt="C10"><figcaption><b>C10</b> 七分割の同時カット。七つの机で、七人が同じ紙を同じ角度でゴミ箱に落とす。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183600_c26c3edf-2d18-4487-af3b-bccc8ab070e5.png" alt="C11"><figcaption><b>C11</b> 翌朝。ゴミ箱は空のまま、机の上に同じ依頼書が戻っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225822_76328579-7157-40eb-8046-44e9dca3f6f6.png" alt="C12"><figcaption><b>C12</b> 7Fふくふく亭。ひかりが弁当の塔を担いで出発。階段を下りはじめる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183631_f693b09f-e236-4bfa-a806-648f116bc192.png" alt="C13"><figcaption><b>C13</b> 各階の机に弁当を置くひかり。置くたびに、同じ依頼書が視界の端に入る。三枚目で足が止まる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183635_b9533c9b-c7c9-4c0d-8fc0-2a15d2475e29.png" alt="C14"><figcaption><b>C14</b> ひかりの手が七枚の依頼書を扇状に広げる。全部同じ文面。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225828_be90a9e0-4495-4493-84ab-fc345a0d93d7.png" alt="C15"><figcaption><b>C15</b> ひかりが階段を駆け上がる。手すりを掴んで踊り場を折り返し、扉を次々に叩く。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225855_81dcb238-31d2-45ce-9a03-65655eb8c82c.png" alt="C16"><figcaption><b>C16</b> 扉が一枚、二枚、三枚と細く開く。隙間から七つの顔が覗く。</figcaption></figure></div><h2>C｜第一回・全社合同会議（という名の惨事）</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225908_107c788d-43d4-487b-bf3c-4f10468784fa.png" alt="C17"><figcaption><b>C17</b> 屋上。長机に七社が着席。全員が微妙に距離をとって座っている。霧が机の脚を舐める。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183703_fb163887-f8ee-4b22-a55f-4bfb75c0ba9e.png" alt="C18"><figcaption><b>C18</b> トメが立って議事進行。ホワイトボードには「一、開式の辞／二、献花」と書かれていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183725_fc5163f9-474d-4b0b-a9c6-83411bd25ba9.png" alt="C19"><figcaption><b>C19</b> 雲井。手元の日誌から目を上げずに。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183731_0e747b1f-c660-4804-9406-46c42af22158.png" alt="C20"><figcaption><b>C20</b> 李に意見が振られる。李は黙って小瓶の蓋を開ける。一同むせて咳き込み、書類が飛ぶ。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183737_8b972e95-0d5b-43d6-9da8-4fc79b6ce9d8.png" alt="C21"><figcaption><b>C21</b> 鏑木が工具箱を開け、机の下で勝手に何かを組み始めている。歯車が転がる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183745_f26b5366-0730-46c3-bc05-0dd3c80162c1.png" alt="C22"><figcaption><b>C22</b> 黒金が活版で組んだ議事録を差し出す。まだ前回のぶん。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183749_e5d2fb54-e7cb-4f40-8677-c3c844c5a4eb.png" alt="C23"><figcaption><b>C23</b> 鵜飼が全員をにこやかにまとめる。手元のメモには各社の内情がびっしり。ペン先が速い。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183755_fbae6a8c-f730-4347-a755-d88a3a08b2e0.png" alt="C24"><figcaption><b>C24</b> ひかりが弁当を配りに来ただけなのに、いつのまにか書記席に座らされている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225917_6b0833fb-91ef-43f0-920e-809bb4c8b534.png" alt="C25"><figcaption><b>C25</b> 全員が同時に喋りだし、机の上が紙と歯車と小瓶で埋まる。決裂。椅子が引かれる音。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225924_e5e13df6-800c-4780-9794-b90babb6a843.png" alt="C26"><figcaption><b>C26</b> 帰りの階段。すれ違う二人が、一瞬だけ目を合わせる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183832_be7b20f1-0435-478d-a45a-712548587ef9.png" alt="C27"><figcaption><b>C27</b> ひかりの書記ノート。七人の名前が、はじめて一枚の紙に並んでいる。</figcaption></figure></div><h2>D｜明日は、どこにある</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225932_6632b346-d681-4698-a687-c5f11428d083.png" alt="C28"><figcaption><b>C28</b> 地下。管理人室の前の廊下に、電球の箱が散らばっている。倒れた柊の足だけが見える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_225938_a7cfe5d8-abfb-4f0c-be7a-a587d0fe2727.png" alt="C29"><figcaption><b>C29</b> 管理人室のベッド。柊が横たわる。枕元にひかり。医者が首を振って出ていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230006_dfd86760-6cd1-41ef-a75e-2c1340db4d49.png" alt="C30"><figcaption><b>C30</b> ひかりが依頼書を突き出す。柊は目だけで笑う。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183914_4e9f7d96-5614-4191-ac07-6e90e49cf188.png" alt="C31"><figcaption><b>C31</b> 依頼書の極大クローズ。一文字ずつ、紙の質も筆跡も違う。切り貼りの継ぎ目が見える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230013_ffe4fee5-017c-4cd3-941e-ca76e43b328d.png" alt="C32"><figcaption><b>C32</b> 机の抽斗が開く。五十年分の紙片が詰まっている。書き損じ、破いた辞表、出せなかった詫び状、渡せなかったラブレターの下書き。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183927_4db95be6-f03d-4d1e-bf4a-94f82b671577.png" alt="C33"><figcaption><b>C33</b> 紙片の一枚一枚に、別の誰かの手の癖がある。フラッシュで、それを書いて捨てた無名の手が重なる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230019_fa87488c-2723-4d33-8f31-92c71ab22544.png" alt="C34"><figcaption><b>C34</b> 柊が天井を見る。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230024_37388869-1a95-40e4-a37f-1e26c37012b5.png" alt="C35"><figcaption><b>C35</b> ひかりが管理人室を飛び出し、階段を駆け上がる。二度目の駆け上がり。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230029_7026a857-0106-4f83-a3ec-66162b42b0f1.png" alt="C36"><figcaption><b>C36</b> 七つの扉が、今度は自分から開く。</figcaption></figure></div><h2>E｜十一分間</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230035_fbc3bacc-72ed-4243-891b-ad1d903058a9.png" alt="C37"><figcaption><b>C37</b> 4F観測所。百年分の日誌が床から天井まで。雲井が一冊を抜き、指で行を追う。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184013_5703d76c-4d2a-4beb-9b32-3d091debc409.png" alt="C38"><figcaption><b>C38</b> 日誌の余白に書かれる数字。七日目、一六:四四〜一六:五五。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230103_da65aab2-2118-4e24-b06f-9137ab11e200.png" alt="C39"><figcaption><b>C39</b> 一同「四が三つ」と渋る。トメだけが満面の笑み。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184025_a70674fb-8a9e-49d5-b952-3bea30ce47b5.png" alt="C40"><figcaption><b>C40</b> 屋上の机に、七社の判が一つずつ押されていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230108_3cdd358d-42b9-4821-b361-bc6eb9443216.png" alt="C41"><figcaption><b>C41</b> 【分担モンタージュ 4F】雲井が秒針を睨み、号令の台本を書く。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230116_595a613b-f739-4594-8630-2d15b0f8064f.png" alt="C42"><figcaption><b>C42</b> 【6F】黒金と大和が活字を拾う。刷り上がるのは、まだ来ていない日付の号外。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230121_0be78fca-c916-4e9e-874a-2b0336d2053b.png" alt="C43"><figcaption><b>C43</b> 【5F】李が調香台に向かう。小瓶が三本並ぶ。妻の味噌汁、雨上がりの校庭、五十年前の一階の線香。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230128_85be4770-9efe-44a6-8f86-6dcbf791c21c.png" alt="C44"><figcaption><b>C44</b> 【2F】鏑木がぜんまい椅子を組む。歯車が噛み、座面がゆっくり回る。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184114_5a88fc3b-a4ba-410a-b080-e5926a731f66.png" alt="C45"><figcaption><b>C45</b> 【3F】鵜飼の帳簿。予算ゼロの案件が、七社の誰も損しない形に組み替わっていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230134_d702026e-b8ee-42bc-b8b4-b2580d86d9ad.png" alt="C46"><figcaption><b>C46</b> 【1F】トメが式次第を書く。「一日をきちんと始めて、きちんと終わらせる」。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230157_8c933092-906d-4814-95a0-28f5a4cf2053.png" alt="C47"><figcaption><b>C47</b> 【7F】ひかりが厨房で九人分の皿を数える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230207_8dbe87a3-9382-4ada-a12e-1a42e41e2cbe.png" alt="C48"><figcaption><b>C48</b> 階段を、七社の人間が上下にすれ違いながら往復する。四十年止まっていた血流が動く。</figcaption></figure></div><h2>F｜裏切り</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230214_a837a2ea-1ee9-484d-8cfd-e98a5960f47e.png" alt="C49"><figcaption><b>C49</b> 六日目。3Fの応接。鵜飼と、見慣れないスーツの男。テーブルに取り壊しの図面と契約書。判が寸前。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184158_872bb4a2-4425-440d-a8d9-bc5a77b24d13.png" alt="C50"><figcaption><b>C50</b> 扉の隙間。それを見ているひかりの目。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230220_9fac6afd-a57c-4ea7-80f3-da8663fada2c.png" alt="C51"><figcaption><b>C51</b> 鵜飼のメモが床にばらまかれる。会議で取っていた各社の内情のメモ。売り物だった。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230226_695c4ea4-0d9c-471e-a4d1-6e3d3e69746d.png" alt="C52"><figcaption><b>C52</b> 七つの扉が、順番に閉まっていく。cut36の完全な反転。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184212_c9ba6bc4-d084-4072-8dc8-b7c412684e0c.png" alt="C53"><figcaption><b>C53</b> 雲井が日誌の数字を消し、書き直す。実現確率 0%。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230231_0c12fd55-7a3d-47cc-8bab-742a061b4a62.png" alt="C54"><figcaption><b>C54</b> 屋上。組みかけのぜんまい椅子だけが霧の中に残されている。誰もいない。</figcaption></figure></div><h2>G｜三階のほんとうの話</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230252_4ef1d50e-e96d-4603-bd6c-c4f4fa2e84a7.png" alt="C55"><figcaption><b>C55</b> 3F。鵜飼が一人。窓の霧に向かって喋りだす。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184248_ee24e0c8-0a9c-4ca9-83ee-49f26ab8bbc0.png" alt="C56"><figcaption><b>C56</b> 回想。七階の厨房で働く母の背中。二階で玩具を作る父の手。少年の鵜飼が階段の踊り場に座っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184255_cec0dcba-efae-41d3-894d-544e82e9a722.png" alt="C57"><figcaption><b>C57</b> 回想。階段の下に落ちた工具箱。散った歯車。父の靴が片方だけ転がっている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184259_9e9b3dad-6944-4a62-9acf-7a5762f97589.png" alt="C58"><figcaption><b>C58</b> 回想。葬儀場に並ぶ空の椅子。誰も座っていない。少年が一人立っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230258_016072ac-2c92-4772-b9c0-2182639788dc.png" alt="C59"><figcaption><b>C59</b> 現在。黙って聞いていたトメが、古い帳簿を机に置いて開く。三十年前の日付。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184310_d2042e41-f172-4653-b964-e8fe43a6dd5b.png" alt="C60"><figcaption><b>C60</b> 帳簿の極大クローズ。喪主欄に「柊源三」。参列者、一名。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230305_6aaa612b-9188-42c3-9a7e-49f969964fc2.png" alt="C61"><figcaption><b>C61</b> 鵜飼の手が止まり、そのまま帳簿を掴む。契約書を破る音は画面外。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184338_3be95d34-0818-4e8f-bef7-62ca73e5acfb.png" alt="C62"><figcaption><b>C62</b> その夜。七社の机に、組み直された帳簿が一枚ずつ置かれていく。予算ゼロの案件が成立してしまう。</figcaption></figure></div><h2>H｜四時四十四分</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230311_e0fa7217-ba10-4c0c-8e1e-0c4ed396f6a7.png" alt="C63"><figcaption><b>C63</b> 七日目。エレベーターの2と6のランプは、やはり点かない。全員が階段を選ぶ。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230324_0b1a7f4c-91e5-4a7c-9155-9851cae48c19.png" alt="C64"><figcaption><b>C64</b> 七社総出でぜんまい椅子を担ぎ、螺旋階段を上げていく。柊が座っている。手から手へ受け渡される。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184357_ff08e636-3830-4de5-900e-166980b522fe.png" alt="C65"><figcaption><b>C65</b> 雲井の腕時計。一六:四三:五〇。秒針。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230329_85c5cfbd-74a3-479e-830c-5748cc255099.png" alt="C66"><figcaption><b>C66</b> 霧が裂ける。世界の外れに、はじめて空と地平が見える。琥珀色の光が屋上に流れ込む。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230401_800ebf6d-68e0-49f9-83c7-e6487d3bf923.png" alt="C67"><figcaption><b>C67</b> 一つの長机を九人が囲んで飯を食っている。cut17の距離が、ゼロになっている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184430_a3d57045-5092-4927-a7ff-a8a700ea90d3.png" alt="C68"><figcaption><b>C68</b> 李が柊の鼻先に小瓶を差し出す。中身は三十年前の、このビルの階段の匂い。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230408_cd7ac0b0-2cab-4d21-8cf6-cd5626eafee8.png" alt="C69"><figcaption><b>C69</b> 柊が椅子の手を離す。座面がゆっくり回り、七つの扉が順に見える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184443_f1dd7a39-d766-4573-9d24-74a337a9524e.png" alt="C70"><figcaption><b>C70</b> 号外の見出し。「本日、晴。果端ビル七社、初の合同事業を完遂」。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230413_94e8bad1-1573-43e5-8e2d-1eb25111fa29.png" alt="C71"><figcaption><b>C71</b> 夜。管理人室。柊の手が布団の上でひらく。静かに息を引き取る。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184452_a59cb66a-7ac9-47a1-b65f-a70b7fd784b1.png" alt="C72"><figcaption><b>C72</b> トメが立ち上がる。喪服の裾が揺れる。</figcaption></figure></div><h2>I｜八社目</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184512_eefd2405-0d96-42d5-8535-8d4eb2d9fdc7.png" alt="C73"><figcaption><b>C73</b> 翌朝。窓の外はいつもの白い霧に戻っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230418_c5e1710f-78e0-40df-91ae-bf736717e2b2.png" alt="C74"><figcaption><b>C74</b> 七つの扉が、全部開いたままになっている。cut5の完全な反転。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230424_28d629b4-7f58-4cf0-ad39-e24e5fd85535.png" alt="C75"><figcaption><b>C75</b> エレベーターの階数表示。1→2→3→4→5→6→7。2と6にも、ランプが点く。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230432_dd420739-f0a6-4ab4-8667-9827a6928566.png" alt="C76"><figcaption><b>C76</b> 管理人室の机に新しい依頼書。差出人欄に七社の判が並び、宛先は空白。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230446_7c825eae-1ee7-487c-9e8f-8cfa7e04c48e.png" alt="C77"><figcaption><b>C77</b> ひかりが宛先欄に自分の名前を書き込む。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_230453_78be7288-a12f-4208-a785-d2ebd2cbea25.png" alt="C78"><figcaption><b>C78</b> 電球の箱を抱えて階段をのぼっていくひかりの後ろ姿。上へ、上へ。暗転。</figcaption></figure></div></body></html>
