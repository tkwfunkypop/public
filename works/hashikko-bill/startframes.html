<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Floyoスタートフレーム 78カット — はしっこビルの明日づくり</title><style>body{background:#151320;color:#e8e6df;font-family:"Hiragino Sans","Yu Gothic",sans-serif;margin:0;padding:40px}h1,h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;letter-spacing:.06em}p.note{opacity:.75;max-width:56em;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin:18px 0 34px}figure{margin:0;background:#0b0b12;border:1px solid rgba(232,230,223,.2);border-radius:10px;overflow:hidden}img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}figcaption{padding:8px 10px;font-size:12px;line-height:1.6}figcaption b{color:#E8A13C;margin-right:6px}</style></head><body><h1>Floyo I2V スタートフレーム — 全78カット</h1><p class="note">各カットのI2V開始フレーム（CANON準拠のフルカラースチル・文字なし）。キャラは承認済み図版、ビル外観はCANON（案3-C&#39;）を参照して生成。検品でNGのカットは番号を指定してもらえればリロールします。台帳は generated.json の kind: floyo_start_frame。</p><h2>A｜果端ビル</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183454_5a66ea04-5662-433b-8dcd-712add8ece81.png" alt="C01"><figcaption><b>C01</b> 白い霧だけの画面。奥に、傾いた七階建てのビルの輪郭がぼんやり浮かぶ。地面はビルの足元で途切れ、その先は何もない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183458_6e33344a-3b24-4893-bde8-2938e7c226d8.png" alt="C02"><figcaption><b>C02</b> 郵便受けの列。七つ。どれも埃をかぶっている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183504_1d2446d8-a84d-4c76-97a4-c9c88ca623e6.png" alt="C03"><figcaption><b>C03</b> 階段の吹き抜けを見上げるアオリ。七層ぶんの手すりが螺旋に重なる。人はいない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183511_106f2db1-bdfd-415c-8cab-9bdf14511b5e.png" alt="C04"><figcaption><b>C04</b> エレベーターの階数表示。1→3→4→5→7。2と6のランプだけ点かない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183515_68581143-2090-49e5-843e-91231d888cfd.png" alt="C05"><figcaption><b>C05</b> 七つの扉が並ぶ廊下。全部閉まっている。時間をずらして出社するので誰ともすれ違わない。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183519_02dd58fe-2fce-40e8-8b9f-d526866def6d.png" alt="C06"><figcaption><b>C06</b> タイトル入れ。霧の中に浮く。</figcaption></figure></div><h2>B｜差出人：このビル</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183540_534dacb6-9e3d-4781-aa84-1c21ba9e3654.png" alt="C07"><figcaption><b>C07</b> 机の上にすべり込む一通の封筒。宛名は各社名。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183547_99b31845-7d53-4d03-8ef0-676aa28c576a.png" alt="C08"><figcaption><b>C08</b> 依頼書のクローズ。件名「明日を一日、つくってください」。納期七日後。予算 金一封。発注者 このビル。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183551_b9fedff0-ee38-4982-95a8-f0ed7297ce6a.png" alt="C09"><figcaption><b>C09</b> 封筒を逆さに振る手。何も落ちてこない。空。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183556_ac78b2db-7515-4c8b-8c61-d2f7c057495a.png" alt="C10"><figcaption><b>C10</b> 七分割の同時カット。七つの机で、七人が同じ紙を同じ角度でゴミ箱に落とす。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183600_c26c3edf-2d18-4487-af3b-bccc8ab070e5.png" alt="C11"><figcaption><b>C11</b> 翌朝。ゴミ箱は空のまま、机の上に同じ依頼書が戻っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183606_481dc44a-587c-4b3f-8b8a-2a23231dd52e.png" alt="C12"><figcaption><b>C12</b> 7Fふくふく亭。ひかりが弁当の塔を担いで出発。階段を下りはじめる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183631_f693b09f-e236-4bfa-a806-648f116bc192.png" alt="C13"><figcaption><b>C13</b> 各階の机に弁当を置くひかり。置くたびに、同じ依頼書が視界の端に入る。三枚目で足が止まる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183635_b9533c9b-c7c9-4c0d-8fc0-2a15d2475e29.png" alt="C14"><figcaption><b>C14</b> ひかりの手が七枚の依頼書を扇状に広げる。全部同じ文面。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183642_2dc61fc6-58f0-4d63-b34f-73f7f8487c34.png" alt="C15"><figcaption><b>C15</b> ひかりが階段を駆け上がる。手すりを掴んで踊り場を折り返し、扉を次々に叩く。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183648_23649a03-31d7-43b6-82f9-90aae1ff3d39.png" alt="C16"><figcaption><b>C16</b> 扉が一枚、二枚、三枚と細く開く。隙間から七つの顔が覗く。</figcaption></figure></div><h2>C｜第一回・全社合同会議（という名の惨事）</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183657_857608ed-5eaf-4e6a-b2ed-10a4a33cba54.png" alt="C17"><figcaption><b>C17</b> 屋上。長机に七社が着席。全員が微妙に距離をとって座っている。霧が机の脚を舐める。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183703_fb163887-f8ee-4b22-a55f-4bfb75c0ba9e.png" alt="C18"><figcaption><b>C18</b> トメが立って議事進行。ホワイトボードには「一、開式の辞／二、献花」と書かれていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183725_fc5163f9-474d-4b0b-a9c6-83411bd25ba9.png" alt="C19"><figcaption><b>C19</b> 雲井。手元の日誌から目を上げずに。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183731_0e747b1f-c660-4804-9406-46c42af22158.png" alt="C20"><figcaption><b>C20</b> 李に意見が振られる。李は黙って小瓶の蓋を開ける。一同むせて咳き込み、書類が飛ぶ。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183737_8b972e95-0d5b-43d6-9da8-4fc79b6ce9d8.png" alt="C21"><figcaption><b>C21</b> 鏑木が工具箱を開け、机の下で勝手に何かを組み始めている。歯車が転がる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183745_f26b5366-0730-46c3-bc05-0dd3c80162c1.png" alt="C22"><figcaption><b>C22</b> 黒金が活版で組んだ議事録を差し出す。まだ前回のぶん。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183749_e5d2fb54-e7cb-4f40-8677-c3c844c5a4eb.png" alt="C23"><figcaption><b>C23</b> 鵜飼が全員をにこやかにまとめる。手元のメモには各社の内情がびっしり。ペン先が速い。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183755_fbae6a8c-f730-4347-a755-d88a3a08b2e0.png" alt="C24"><figcaption><b>C24</b> ひかりが弁当を配りに来ただけなのに、いつのまにか書記席に座らされている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183819_02dcf87b-de81-4d72-a24e-427dd51c8724.png" alt="C25"><figcaption><b>C25</b> 全員が同時に喋りだし、机の上が紙と歯車と小瓶で埋まる。決裂。椅子が引かれる音。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183824_84c62ee6-c265-42cd-9264-75c042227945.png" alt="C26"><figcaption><b>C26</b> 帰りの階段。すれ違う二人が、一瞬だけ目を合わせる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183832_be7b20f1-0435-478d-a45a-712548587ef9.png" alt="C27"><figcaption><b>C27</b> ひかりの書記ノート。七人の名前が、はじめて一枚の紙に並んでいる。</figcaption></figure></div><h2>D｜明日は、どこにある</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183839_bdbb8004-108a-4580-965f-1dfc545ae03d.png" alt="C28"><figcaption><b>C28</b> 地下。管理人室の前の廊下に、電球の箱が散らばっている。倒れた柊の足だけが見える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183844_706e726a-73cf-4161-ab07-5c4da7e2aaf4.png" alt="C29"><figcaption><b>C29</b> 管理人室のベッド。柊が横たわる。枕元にひかり。医者が首を振って出ていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183850_defbbfe2-3162-429e-837b-f79450502bae.png" alt="C30"><figcaption><b>C30</b> ひかりが依頼書を突き出す。柊は目だけで笑う。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183914_4e9f7d96-5614-4191-ac07-6e90e49cf188.png" alt="C31"><figcaption><b>C31</b> 依頼書の極大クローズ。一文字ずつ、紙の質も筆跡も違う。切り貼りの継ぎ目が見える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183921_e8cb2936-3145-4601-9e77-c8f84aa876d7.png" alt="C32"><figcaption><b>C32</b> 机の抽斗が開く。五十年分の紙片が詰まっている。書き損じ、破いた辞表、出せなかった詫び状、渡せなかったラブレターの下書き。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183927_4db95be6-f03d-4d1e-bf4a-94f82b671577.png" alt="C33"><figcaption><b>C33</b> 紙片の一枚一枚に、別の誰かの手の癖がある。フラッシュで、それを書いて捨てた無名の手が重なる。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183931_bc0bd10f-ce81-4036-aaef-fa49c47e9645.png" alt="C34"><figcaption><b>C34</b> 柊が天井を見る。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183937_cd429d5b-00b0-4bdf-bf8c-f0d0c352f6ac.png" alt="C35"><figcaption><b>C35</b> ひかりが管理人室を飛び出し、階段を駆け上がる。二度目の駆け上がり。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_183943_967acf7f-a126-4880-83eb-cc311a574ebb.png" alt="C36"><figcaption><b>C36</b> 七つの扉が、今度は自分から開く。</figcaption></figure></div><h2>E｜十一分間</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184007_b09d7a4e-9ad1-4ea4-a131-ff20124c7e53.png" alt="C37"><figcaption><b>C37</b> 4F観測所。百年分の日誌が床から天井まで。雲井が一冊を抜き、指で行を追う。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184013_5703d76c-4d2a-4beb-9b32-3d091debc409.png" alt="C38"><figcaption><b>C38</b> 日誌の余白に書かれる数字。七日目、一六:四四〜一六:五五。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184018_67b6cd3f-2066-467a-8fca-2f1e252813a7.png" alt="C39"><figcaption><b>C39</b> 一同「四が三つ」と渋る。トメだけが満面の笑み。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184025_a70674fb-8a9e-49d5-b952-3bea30ce47b5.png" alt="C40"><figcaption><b>C40</b> 屋上の机に、七社の判が一つずつ押されていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184031_26b00563-998b-4fda-9147-eabe02145342.png" alt="C41"><figcaption><b>C41</b> 【分担モンタージュ 4F】雲井が秒針を睨み、号令の台本を書く。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184039_e5cbc757-ea17-4434-94ea-4455628010a1.png" alt="C42"><figcaption><b>C42</b> 【6F】黒金と大和が活字を拾う。刷り上がるのは、まだ来ていない日付の号外。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184101_210eb76c-f0c4-4536-bb3a-60a061e92007.png" alt="C43"><figcaption><b>C43</b> 【5F】李が調香台に向かう。小瓶が三本並ぶ。妻の味噌汁、雨上がりの校庭、五十年前の一階の線香。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184107_35e24bb3-9d1c-47f3-9ded-b957f55dd04b.png" alt="C44"><figcaption><b>C44</b> 【2F】鏑木がぜんまい椅子を組む。歯車が噛み、座面がゆっくり回る。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184114_5a88fc3b-a4ba-410a-b080-e5926a731f66.png" alt="C45"><figcaption><b>C45</b> 【3F】鵜飼の帳簿。予算ゼロの案件が、七社の誰も損しない形に組み替わっていく。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184119_21e80af2-2ffe-413b-b563-e15abae7ce55.png" alt="C46"><figcaption><b>C46</b> 【1F】トメが式次第を書く。「一日をきちんと始めて、きちんと終わらせる」。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184123_37352a88-b636-4fb8-88fd-000c2e0310c5.png" alt="C47"><figcaption><b>C47</b> 【7F】ひかりが厨房で九人分の皿を数える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184128_48d46ac9-e9e8-491c-b6f6-1f036f121842.png" alt="C48"><figcaption><b>C48</b> 階段を、七社の人間が上下にすれ違いながら往復する。四十年止まっていた血流が動く。</figcaption></figure></div><h2>F｜裏切り</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184151_70a73fc4-a067-4da4-b590-437da46f1c46.png" alt="C49"><figcaption><b>C49</b> 六日目。3Fの応接。鵜飼と、見慣れないスーツの男。テーブルに取り壊しの図面と契約書。判が寸前。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184158_872bb4a2-4425-440d-a8d9-bc5a77b24d13.png" alt="C50"><figcaption><b>C50</b> 扉の隙間。それを見ているひかりの目。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184203_7cabde3a-f608-43b3-8f62-c95dd1573dc9.png" alt="C51"><figcaption><b>C51</b> 鵜飼のメモが床にばらまかれる。会議で取っていた各社の内情のメモ。売り物だった。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184207_ef2aee74-ef84-44eb-a9f4-c72c5a62e87f.png" alt="C52"><figcaption><b>C52</b> 七つの扉が、順番に閉まっていく。cut36の完全な反転。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184212_c9ba6bc4-d084-4072-8dc8-b7c412684e0c.png" alt="C53"><figcaption><b>C53</b> 雲井が日誌の数字を消し、書き直す。実現確率 0%。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184220_8c1cbeae-0931-49af-b178-458b8e3845cf.png" alt="C54"><figcaption><b>C54</b> 屋上。組みかけのぜんまい椅子だけが霧の中に残されている。誰もいない。</figcaption></figure></div><h2>G｜三階のほんとうの話</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184241_5fac3f7f-1462-4921-83c3-cf0d882c6a43.png" alt="C55"><figcaption><b>C55</b> 3F。鵜飼が一人。窓の霧に向かって喋りだす。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184248_ee24e0c8-0a9c-4ca9-83ee-49f26ab8bbc0.png" alt="C56"><figcaption><b>C56</b> 回想。七階の厨房で働く母の背中。二階で玩具を作る父の手。少年の鵜飼が階段の踊り場に座っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184255_cec0dcba-efae-41d3-894d-544e82e9a722.png" alt="C57"><figcaption><b>C57</b> 回想。階段の下に落ちた工具箱。散った歯車。父の靴が片方だけ転がっている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184259_9e9b3dad-6944-4a62-9acf-7a5762f97589.png" alt="C58"><figcaption><b>C58</b> 回想。葬儀場に並ぶ空の椅子。誰も座っていない。少年が一人立っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184305_d3410dfe-116f-4e4b-a4e1-95f2815ecde6.png" alt="C59"><figcaption><b>C59</b> 現在。黙って聞いていたトメが、古い帳簿を机に置いて開く。三十年前の日付。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184310_d2042e41-f172-4653-b964-e8fe43a6dd5b.png" alt="C60"><figcaption><b>C60</b> 帳簿の極大クローズ。喪主欄に「柊源三」。参列者、一名。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184332_e5029979-32e6-48fa-b92d-666b1e324ec1.png" alt="C61"><figcaption><b>C61</b> 鵜飼の手が止まり、そのまま帳簿を掴む。契約書を破る音は画面外。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184338_3be95d34-0818-4e8f-bef7-62ca73e5acfb.png" alt="C62"><figcaption><b>C62</b> その夜。七社の机に、組み直された帳簿が一枚ずつ置かれていく。予算ゼロの案件が成立してしまう。</figcaption></figure></div><h2>H｜四時四十四分</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184345_204f80df-42c7-4e6c-9eb7-af86b83e2dd1.png" alt="C63"><figcaption><b>C63</b> 七日目。エレベーターの2と6のランプは、やはり点かない。全員が階段を選ぶ。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184351_a8a2e762-81ea-448f-8d67-28c9c6a947fd.png" alt="C64"><figcaption><b>C64</b> 七社総出でぜんまい椅子を担ぎ、螺旋階段を上げていく。柊が座っている。手から手へ受け渡される。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184357_ff08e636-3830-4de5-900e-166980b522fe.png" alt="C65"><figcaption><b>C65</b> 雲井の腕時計。一六:四三:五〇。秒針。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184405_46682871-adb2-4b81-9a2c-a3e87f4e96b6.png" alt="C66"><figcaption><b>C66</b> 霧が裂ける。世界の外れに、はじめて空と地平が見える。琥珀色の光が屋上に流れ込む。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184425_d7bdd6ff-97a2-439d-9300-1d0007fc7458.png" alt="C67"><figcaption><b>C67</b> 一つの長机を九人が囲んで飯を食っている。cut17の距離が、ゼロになっている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184430_a3d57045-5092-4927-a7ff-a8a700ea90d3.png" alt="C68"><figcaption><b>C68</b> 李が柊の鼻先に小瓶を差し出す。中身は三十年前の、このビルの階段の匂い。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184437_96d89c37-82f1-4802-82b5-530caaf4f208.png" alt="C69"><figcaption><b>C69</b> 柊が椅子の手を離す。座面がゆっくり回り、七つの扉が順に見える。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184443_f1dd7a39-d766-4573-9d24-74a337a9524e.png" alt="C70"><figcaption><b>C70</b> 号外の見出し。「本日、晴。果端ビル七社、初の合同事業を完遂」。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184448_54043a0e-62f5-459c-80f7-8efd3f6f3f5a.png" alt="C71"><figcaption><b>C71</b> 夜。管理人室。柊の手が布団の上でひらく。静かに息を引き取る。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184452_a59cb66a-7ac9-47a1-b65f-a70b7fd784b1.png" alt="C72"><figcaption><b>C72</b> トメが立ち上がる。喪服の裾が揺れる。</figcaption></figure></div><h2>I｜八社目</h2><div class="grid"><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184512_eefd2405-0d96-42d5-8535-8d4eb2d9fdc7.png" alt="C73"><figcaption><b>C73</b> 翌朝。窓の外はいつもの白い霧に戻っている。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184517_b84b8fa4-dad9-4dcc-8a51-0628dae3ed5f.png" alt="C74"><figcaption><b>C74</b> 七つの扉が、全部開いたままになっている。cut5の完全な反転。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184523_c2218e7c-763e-4cc2-b2f2-8eb290d2c13a.png" alt="C75"><figcaption><b>C75</b> エレベーターの階数表示。1→2→3→4→5→6→7。2と6にも、ランプが点く。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184528_7133fcd1-f5db-48d1-9fc1-0eb491e00c0c.png" alt="C76"><figcaption><b>C76</b> 管理人室の机に新しい依頼書。差出人欄に七社の判が並び、宛先は空白。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184535_7beee0eb-6236-4fe3-9b38-06d77e300cba.png" alt="C77"><figcaption><b>C77</b> ひかりが宛先欄に自分の名前を書き込む。</figcaption></figure><figure><img loading="lazy" src="https://d8j0ntlcm91z4.cloudfront.net/user_2zNszn2HPoxCjsMuer3ngh13EDo/hf_20260730_184541_d41d3422-78f0-4431-aefb-776a37e424d1.png" alt="C78"><figcaption><b>C78</b> 電球の箱を抱えて階段をのぼっていくひかりの後ろ姿。上へ、上へ。暗転。</figcaption></figure></div></body></html>
